<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태인 - 익명 이야기 공간</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="location.reload()">
                <div class="w-9 h-9 bg-brand-600 text-white rounded-xl flex items-center justify-center font-bold text-lg shadow-md shadow-brand-500/20">태</div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">태인 <span class="text-xs font-normal text-slate-500 ml-1">익명 이야기 공간</span></h1>
            </div>
            
            <!-- 로그인 상태 표시 영역 -->
            <div id="authArea" class="flex items-center space-x-3">
                <button onclick="openLoginModal()" class="flex items-center space-x-2 text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl transition font-medium">
                    <i class="fa-brands fa-google text-slate-500"></i>
                    <span>로그인</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-3xl w-full mx-auto px-4 py-6 flex-grow">
        
        <!-- 글 작성 카드 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-6">
            <h2 class="text-sm font-semibold text-slate-700 mb-3 flex items-center">
                <i class="fa-solid fa-pen-nib mr-2 text-brand-600"></i> 자유롭게 이야기를 남겨주세요 (완전 익명)
            </h2>
            <form id="postForm" onsubmit="handlePostSubmit(event)" class="space-y-3">
                <input type="text" id="postTitle" placeholder="제목을 입력하세요" required
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm transition">
                <textarea id="postContent" rows="3" placeholder="내용을 입력하세요. (로그인 여부와 관계없이 닉네임은 표시되지 않습니다)" required
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm transition resize-none"></textarea>
                <div class="flex justify-end">
                    <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white font-medium px-5 py-2 rounded-xl text-sm transition shadow-sm shadow-brand-500/20 flex items-center space-x-1.5">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                        <span>글 등록하기</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- 검색 및 정렬 바 -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-3 mb-5">
            <div class="relative w-full sm:w-64">
                <i class="fa-solid fa-search absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                <input type="text" id="searchInput" oninput="renderPosts()" placeholder="글 검색..." 
                    class="w-full pl-9 pr-4 py-2 bg-white rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                <button onclick="setSort('latest')" id="sortLatest" class="text-xs px-3 py-1.5 rounded-lg font-medium bg-brand-50 text-brand-700 transition">최신순</button>
                <button onclick="setSort('likes')" id="sortLikes" class="text-xs px-3 py-1.5 rounded-lg font-medium text-slate-600 hover:bg-slate-100 transition">공감순</button>
            </div>
        </div>

        <!-- 게시물 목록 -->
        <div id="postsContainer" class="space-y-4">
            <!-- 자바스크립트로 렌더링됨 -->
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-400">
        <p>&copy; 태인 (Taein). All rights reserved. 누구나 자유롭게 소통하는 공간.</p>
    </footer>

    <!-- 로그인 모달 -->
    <div id="loginModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-xl border border-slate-100">
            <div class="text-center mb-5">
                <div class="w-12 h-12 bg-brand-50 text-brand-600 rounded-2xl mx-auto flex items-center justify-center text-xl mb-3 shadow-inner">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-900">관리자 로그인</h3>
                <p class="text-xs text-slate-500 mt-1">관리자 권한 확인을 위해 구글 계정으로 로그인하세요.<br>(ijihu934@gmail.com 계정만 관리자 권한 부여)</p>
            </div>
            <div class="space-y-3">
                <input type="email" id="loginEmailInput" placeholder="구글 이메일 입력 (예: ijihu934@gmail.com)" 
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                <button onclick="simulateGoogleLogin()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-sm">
                    구글 계정으로 로그인
                </button>
            </div>
            <button onclick="closeLoginModal()" class="w-full mt-2 text-slate-500 hover:text-slate-700 text-xs py-2 transition">닫기</button>
        </div>
    </div>

    <script>
        // 초기 데이터 로드 및 상태 관리
        let posts = JSON.parse(localStorage.getItem('taein_posts')) || [
            { id: 1, title: '태인 사이트에 오신 것을 환영합니다!', content: '이곳은 누구나 익명으로 자유롭게 글을 남기고 소통할 수 있는 공간입니다.', date: new Date().toISOString(), likes: 3, comments: [] }
        ];
        let currentSort = 'latest';
        let currentUser = JSON.parse(localStorage.getItem('taein_user')) || null;

        // 초기 실행
        window.onload = function() {
            updateAuthUI();
            renderPosts();
        };

        // 로그인 모달 제어
        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }
        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        // 구글 로그인 시뮬레이션
        function simulateGoogleLogin() {
            const emailInput = document.getElementById('loginEmailInput').value.trim();
            if(!emailInput) {
                alert('이메일을 입력해주세요.');
                return;
            }
            
            const isAdmin = (emailInput.toLowerCase() === 'ijihu934@gmail.com');
            currentUser = {
                email: emailInput,
                isAdmin: isAdmin
            };

            localStorage.setItem('taein_user', JSON.stringify(currentUser));
            closeLoginModal();
            updateAuthUI();
            renderPosts();

            if(isAdmin) {
                alert('관리자(ijihu934@gmail.com) 계정으로 로그인되었습니다. 게시물 삭제 권한이 활성화됩니다.');
            } else {
                alert('일반 계정으로 로그인되었습니다.');
            }
        }

        // 로그아웃
        function logout() {
            currentUser = null;
            localStorage.removeItem('taein_user');
            updateAuthUI();
            renderPosts();
            alert('로그아웃되었습니다.');
        }

        // 상단 인증 UI 업데이트
        function updateAuthUI() {
            const authArea = document.getElementById('authArea');
            if(currentUser) {
                authArea.innerHTML = `
                    <div class="flex items-center space-x-2">
                        ${currentUser.isAdmin ? '<span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-bold flex items-center"><i class="fa-solid fa-crown mr-1"></i> 관리자</span>' : ''}
                        <span class="text-xs text-slate-600 hidden sm:inline">${currentUser.email}</span>
                        <button onclick="logout()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-xl transition">로그아웃</button>
                    </div>
                `;
            } else {
                authArea.innerHTML = `
                    <button onclick="openLoginModal()" class="flex items-center space-x-2 text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl transition font-medium">
                        <i class="fa-brands fa-google text-slate-500"></i>
                        <span>로그인</span>
                    </button>
                `;
            }
        }

        // 글 등록
        function handlePostSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();

            if(!title || !content) return;

            const newPost = {
                id: Date.now(),
                title: title,
                content: content,
                date: new Date().toISOString(),
                likes: 0,
                comments: []
            };

            posts.unshift(newPost);
            saveAndRender();

            document.getElementById('postForm').reset();
        }

        // 게시물 삭제 (관리자 전용)
        function deletePost(postId) {
            if(!currentUser || !currentUser.isAdmin) {
                alert('관리자 권한이 없습니다.');
                return;
            }
            if(confirm('이 게시물을 정말 삭제하시겠습니까?')) {
                posts = posts.filter(p => p.id !== postId);
                saveAndRender();
            }
        }

        // 좋아요 토글
        function toggleLike(postId) {
            const post = posts.find(p => p.id === postId);
            if(post) {
                post.likes += 1;
                saveAndRender();
            }
        }

        // 댓글 추가 (익명)
        function addComment(event, postId) {
            event.preventDefault();
            const input = document.getElementById
