<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>태인 - 익명 이야기 공간</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
<header class="bg-white border-b px-4 h-16 flex items-center justify-between sticky top-0 z-30 shadow-sm">
<div class="font-bold text-lg text-emerald-600 cursor-pointer" onclick="location.reload()">태인</div>
<div id="authArea"><button onclick="login()" class="text-xs bg-slate-100 px-3 py-1.5 rounded-lg font-medium">로그인</button></div>
</header>
<main class="max-w-xl w-full mx-auto p-4 flex-grow">
<form onsubmit="addPost(event)" class="bg-white p-4 rounded-xl border mb-4 space-y-2 shadow-sm">
<input type="text" id="t" placeholder="제목을 입력하세요" required class="w-full p-2 border rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-1 focus:ring-emerald-500">
<textarea id="c" placeholder="내용을 입력하세요 (닉네임 없음)" required class="w-full p-2 border rounded-lg text-sm bg-slate-50 resize-none focus:outline-none focus:ring-1 focus:ring-emerald-500" rows="3"></textarea>
<button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-sm font-medium transition">글 등록하기</button>
</form>
<div id="posts" class="space-y-3"></div>
</main>
<script>
// 데이터 로드 안정성 강화 (오류 방지)
let posts = [];
try {
    posts = JSON.parse(localStorage.getItem('taein_p')) || [];
} catch (e) {
    posts = [];
}

let user = null;
try {
    user = JSON.parse(localStorage.getItem('taein_u')) || null;
} catch (e) {
    user = null;
}

window.onload = () => { 
    try {
        render(); 
        updateAuth(); 
    } catch(err) {
        console.error(err);
    }
};

function login() {
    let email = prompt('관리자 이메일(ijihu934@gmail.com)을 입력하세요:');
    if(!email) return;
    let isAdmin = email.trim().toLowerCase() === 'ijihu934@gmail.com';
    user = { email, isAdmin };
    try {
        localStorage.setItem('taein_u', JSON.stringify(user));
    } catch(e) {}
    updateAuth(); 
    render();
    alert(isAdmin ? '관리자 로그인 성공! 삭제 권한 활성화.' : '일반 로그인 성공.');
}

function logout() { 
    user = null; 
    try {
        localStorage.removeItem('taein_u'); 
    } catch(e) {}
    updateAuth(); 
    render(); 
    alert('로그아웃되었습니다.'); 
}

function updateAuth() {
    const authArea = document.getElementById('authArea');
    if(!authArea) return;
    authArea.innerHTML = user ? 
        `<div class="flex items-center gap-2">${user.isAdmin?'<span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold">👑 관리자</span>':''}<button onclick="logout()" class="text-xs bg-slate-100 px-2.5 py-1 rounded">로그아웃</button></div>` :
        `<button onclick="login()" class="text-xs bg-slate-100 px-3 py-1.5 rounded-lg font-medium">로그인</button>`;
}

function addPost(e) {
    e.preventDefault();
    let titleEl = document.getElementById('t');
    let contentEl = document.getElementById('c');
    if(!titleEl || !contentEl) return;

    posts.unshift({
        id: Date.now(), 
        title: titleEl.value, 
        content: contentEl.value, 
        comments: []
    });
    
    try {
        localStorage.setItem('taein_p', JSON.stringify(posts));
    } catch(e) {}
    
    titleEl.value = ''; 
    contentEl.value = '';
    render();
}

function delPost(id) {
    if(!user?.isAdmin) return alert('관리자 권한이 없습니다.');
    if(confirm('게시글을 삭제하시겠습니까?')) {
        posts = posts.filter(p => p.id !== id);
        try {
            localStorage.setItem('taein_p', JSON.stringify(posts));
        } catch(e) {}
        render();
    }
}

function addComm(e, id) {
    e.preventDefault();
    let input = document.getElementById('com_'+id);
    if(!input) return;
    let text = input.value.trim();
    if(!text) return;
    let p = posts.find(x => x.id === id);
    if(p) { 
        p.comments.push({text}); 
        try {
            localStorage.setItem('taein_p', JSON.stringify(posts));
        } catch(e) {}
        render(); 
    }
}

function render() {
    let container = document.getElementById('posts');
    if(!container) return;

    let html = posts.map(p => `
        <div class="bg-white p-4 rounded-xl border shadow-sm space-y-2">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="w-6 h-6 bg-slate-100 rounded-full flex items-center justify-center text-[10px] font-bold text-slate-500">익명</span>
                    <span class="font-bold text-sm text-slate-900">${escapeHtml(p.title)}</span>
                </div>
                ${user?.isAdmin ? `<button onclick="delPost(${p.id})" class="text-xs text-red-500 font-bold hover:underline">삭제</button>` : ''}
            </div>
            <p class="text-xs text-slate-700 whitespace-pre-wrap pl-8">${escapeHtml(p.content)}</p>
            <div class="border-t pt-2 pl-8 space-y-1">
                ${p.comments.map(c=>`<div class="text-[11px] bg-slate-50 p-1.5 rounded"><strong class="mr-1">익명:</strong>${escapeHtml(c.text)}</div>`).join('')}
                <form onsubmit="addComm(event, ${p.id})" class="flex gap-1 mt-1">
                    <input type="text" id="com_${p.id}" placeholder="댓글 남기기..." class="flex-grow p-1.5 border rounded-lg text-xs bg-slate-50 focus:outline-none">
                    <button type="submit" class="bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs">등록</button>
                </form>
            </div>
        </div>
    `).join('');
    container.innerHTML = html || '<div class="text-center text-xs text-slate-400 py-8">등록된 이야기가 없습니다.</div>';
}

function escapeHtml(text) {
    if(!text) return '';
    return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
</script>
</body>
</html>
